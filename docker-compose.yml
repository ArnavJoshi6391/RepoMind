services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: repomind-postgres
    restart: always
    environment:
      POSTGRES_USER: repomind
      POSTGRES_PASSWORD: repomind_pass
      POSTGRES_DB: repomind_db
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repomind -d repomind_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: repomind-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
